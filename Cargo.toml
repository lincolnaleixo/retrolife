[workspace]
members = [
    "crates/retrolife-core",
    "crates/retrolife-launch-fixture",
    "frontend/godot-bridge",
    "frontend/launch-bridge",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "LicenseRef-Proprietary"
publish = false

[workspace.dependencies]
godot = { version = "=0.5.4", features = ["api-4-7"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
