name: Updater
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: updater-${{ github.ref }}
  cancel-in-progress: true
jobs:
  updater-inputs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify pinned updater distribution
        run: |
          set -euo pipefail
          mkdir -p .cache/updater-inputs
          curl --fail --location --proto '=https' --tlsv1.2 https://github.com/sparkle-project/Sparkle/releases/download/2.10.0/Sparkle-2.10.0.tar.xz -o .cache/updater-inputs/Sparkle-2.10.0.tar.xz
          echo 'c2bf58aa8387266ac179357b1415d6f2635f044da8be41042af32425dae6da0c  .cache/updater-inputs/Sparkle-2.10.0.tar.xz' | sha256sum --check
          git archive HEAD > .cache/updater-inputs/source.tar
      - name: Retain isolated reproduction inputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: updater-inputs
          path: .cache/updater-inputs/
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: error
