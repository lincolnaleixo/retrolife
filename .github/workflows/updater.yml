name: Updater
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: updater-${{ github.ref }}
  cancel-in-progress: true
jobs:
  updater-native:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Compile production updater and test real Sparkle installation
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          scripts/build-macos-updater.sh
          python3 scripts/test-updater-native.py 2>&1 | tee .cache/updater-native.log
      - name: Retain native evidence without test keys or bundles
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: updater-native-evidence
          path: |
            .cache/updater-native.log
            .cache/updater-native-results.json
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn
