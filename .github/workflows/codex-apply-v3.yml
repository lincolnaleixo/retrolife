name: Codex apply validated M2.2 v3 package

on:
  push:
    branches: [codex/m2-2-physical-rebuild]
    paths: [.github/workflows/codex-apply-v3.yml]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: codex-apply-m2-2-v3
  cancel-in-progress: false

env:
  PATCH_BLOB_SHA: "04251f1569de48e84666e4aee2c0b2f05bedc2ed"
  PATCH_SHA256: "a9685d678d2e3334b11eb7c4f3d600f6d607a7f2dd286863102181be2078e473"
  GODOT_VERSION: "4.7"
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out current public branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Download and apply validated v3 package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          response="$RUNNER_TEMP/v3-blob.json"
          archive="$RUNNER_TEMP/retrolife-m2-2-v3.tar.gz"
          curl --fail --location --retry 5 --retry-delay 2 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --output "$response" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs/${PATCH_BLOB_SHA}"
          jq -r '.content' "$response" | tr -d '\n' | base64 --decode > "$archive"
          echo "${PATCH_SHA256}  $archive" | sha256sum --check --status
          tar -xzf "$archive" -C .
          rm -rf .github/codex-v3-patch
          rm -f .github/workflows/codex-apply-v3.yml
          rm -f .github/workflows/codex-export-v3.yml
          rm -f frontend/godot-ui/scripts/snes_na_cartridge_m2_2_v2.gd
          test -f frontend/godot-ui/assets/snes/m2_2/snes_ntsc_u_front_shell_v3.obj
          test -f frontend/design/mobile/m2-2-snes-v3-mobile-review.png
          git diff --check

      - name: Install pinned Gitleaks
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --location --retry 5 --retry-delay 2 \
            --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $archive" | sha256sum --check --status
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          chmod +x "$RUNNER_TEMP/gitleaks"
          echo "GITLEAKS_BIN=$RUNNER_TEMP/gitleaks" >> "$GITHUB_ENV"

      - name: Verify Rust and public source safety
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo test --workspace --locked
          "$GITLEAKS_BIN" git --no-banner --redact --log-opts=--all .
          "$GITLEAKS_BIN" dir --no-banner --redact .

      - name: Verify deterministic design contracts
        run: |
          set -euo pipefail
          python3 -m compileall -q scripts
          python3 scripts/verify-m1-snes-contract.py
          python3 scripts/verify-m2-snes-reference.py
          python3 scripts/generate-m2-2-snes-front.py --check
          python3 scripts/verify-m2-2-snes-front.py
          git diff --check

      - name: Install official Godot
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          install_root="$RUNNER_TEMP/godot-${GODOT_VERSION}"
          curl --fail --location --retry 5 --retry-delay 2 \
            --output "$archive" \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          mkdir -p "$install_root"
          unzip -q "$archive" -d "$install_root"
          godot_bin="$install_root/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          chmod +x "$godot_bin"
          "$godot_bin" --version
          echo "GODOT_BIN=$godot_bin" >> "$GITHUB_ENV"

      - name: Import and smoke test v3 in Godot
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path frontend/godot-ui --editor --quit-after 20
          "$GODOT_BIN" --headless --path frontend/godot-ui \
            --script res://scripts/m2_2_snes_front_smoke_test.gd \
            | tee "$RUNNER_TEMP/m2-2-v3-smoke.txt"
          grep -Fq 'RETROLIFE_M2_2_FRONT_GODOT_OK asset=v3' "$RUNNER_TEMP/m2-2-v3-smoke.txt"

      - name: Commit and push the exact validated package
        id: publish
        run: |
          set -euo pipefail
          git config user.name "lincolnaleixo"
          git config user.email "2906581+lincolnaleixo@users.noreply.github.com"
          git add -A
          test -n "$(git status --porcelain)"
          git commit -m "feat: rebuild M2.2 from physical reference profiles"
          git push origin HEAD:codex/m2-2-physical-rebuild
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Dispatch independent final checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for workflow in ci.yml m2-2-snes-front.yml; do
            curl --fail --location --retry 5 --retry-delay 2 \
              --request POST \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/dispatches" \
              --data '{"ref":"codex/m2-2-physical-rebuild"}'
          done
          echo "RETROLIFE_M2_2_V3_PUBLISHED ${{ steps.publish.outputs.sha }}"
