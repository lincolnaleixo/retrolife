name: Codex M2.3 Blender staging render

on:
  push:
    branches: [codex/m2-3-blender-stage]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codex-m2-3-blender-stage
  cancel-in-progress: true

env:
  BLENDER_VERSION: "5.2.1"
  GENERATOR_SHA256: "c83fa79015f04bd2b0023a03707701a8fb96828b5caa91a664f43911870267e9"

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out staged public source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Reconstruct staged Blender generator
        shell: bash
        run: |
          set -euo pipefail
          chunks=(
            .codex-blender-source/part-00.b64
            .codex-blender-source/part-01a.b64
            .codex-blender-source/part-01b.b64
            .codex-blender-source/part-02.b64
            .codex-blender-source/part-03.b64
            .codex-blender-source/part-04.b64
            .codex-blender-source/part-05.b64
            .codex-blender-source/part-06.b64
            .codex-blender-source/part-07.b64
          )
          for chunk in "${chunks[@]}"; do
            test -s "$chunk"
          done
          mkdir -p scripts/blender
          cat "${chunks[@]}" \
            | tr -d '\r\n ' \
            | base64 --decode \
            > scripts/blender/generate_m2_3_snes_cartridge.py
          echo "${GENERATOR_SHA256}  scripts/blender/generate_m2_3_snes_cartridge.py" \
            | sha256sum --check --status
          # Blender 5.2 LTS exposes Eevee as BLENDER_EEVEE in background builds.
          sed -i 's/BLENDER_EEVEE_NEXT/BLENDER_EEVEE/' \
            scripts/blender/generate_m2_3_snes_cartridge.py
          python3 .codex-blender-source/stage_patch.py
          python3 -m py_compile scripts/blender/generate_m2_3_snes_cartridge.py

      - name: Install rendering runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libegl1 \
            libgl1 \
            libgl1-mesa-dri \
            libx11-6 \
            libxfixes3 \
            libxi6 \
            libxkbcommon0 \
            libxrender1 \
            libxxf86vm1 \
            xauth \
            xvfb

      - name: Install pinned official Blender
        shell: bash
        run: |
          set -euo pipefail
          archive="blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          checksum="blender-${BLENDER_VERSION}.sha256"
          base="https://download.blender.org/release/Blender5.2"
          curl --fail --location --retry 5 --retry-delay 2 \
            --output "$RUNNER_TEMP/$archive" "$base/$archive"
          curl --fail --location --retry 5 --retry-delay 2 \
            --output "$RUNNER_TEMP/$checksum" "$base/$checksum"
          expected="$(grep -E "[[:space:]]${archive}$" "$RUNNER_TEMP/$checksum" | head -n 1)"
          test -n "$expected"
          printf '%s\n' "$expected" | (cd "$RUNNER_TEMP" && sha256sum --check --status)
          mkdir -p "$RUNNER_TEMP/blender"
          tar -xJf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/blender" --strip-components=1
          "$RUNNER_TEMP/blender/blender" --version
          echo "BLENDER_BIN=$RUNNER_TEMP/blender/blender" >> "$GITHUB_ENV"

      - name: Generate quick Blender review package
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -euo pipefail
          xvfb-run --auto-servernum --server-args='-screen 0 1920x1080x24 -nolisten tcp' \
            "$BLENDER_BIN" \
              --background \
              --factory-startup \
              --python scripts/blender/generate_m2_3_snes_cartridge.py \
              -- \
              --root "$GITHUB_WORKSPACE" \
              --quick \
            | tee "$RUNNER_TEMP/blender-stage.log"
          grep -Fq 'RETROLIFE_M2_3_BLENDER_OK' "$RUNNER_TEMP/blender-stage.log"
          test -s frontend/design/m2-3-snes-blender-manifest.json
          test -s frontend/godot-ui/assets/snes/m2_3/snes_ntsc_u_cartridge_m2_3.blend
          test -s frontend/design/mobile/m2-3-snes-blender-front.png
          test -s frontend/design/mobile/m2-3-snes-blender-rear.png
          test -s frontend/design/mobile/m2-3-snes-blender-bottom.png
          git diff --check

      - name: Upload generated Blender package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: retrolife-m2-3-blender-${{ github.sha }}
          path: |
            scripts/blender/generate_m2_3_snes_cartridge.py
            frontend/design/m2-3-snes-blender-manifest.json
            frontend/design/mobile/m2-3-snes-blender-*.png
            frontend/godot-ui/assets/snes/m2_3/
            ${{ runner.temp }}/blender-stage.log
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
