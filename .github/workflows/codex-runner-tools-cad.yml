name: Codex temporary CAD runner tools

on:
  pull_request:
    branches: [main]
  push:
    branches: [codex/m2-2-physical-rebuild]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GODOT_VERSION: "4.7"
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - name: Check out immutable commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Package Rust, Godot and Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/retrolife-runner-tools"
          mkdir -p "$root/bin" "$root/rust"

          rust_sysroot="$(rustc --print sysroot)"
          cp -a "$rust_sysroot"/. "$root/rust/"
          "$root/rust/bin/rustc" --version
          "$root/rust/bin/cargo" --version
          "$root/rust/bin/rustfmt" --version

          godot_archive="$RUNNER_TEMP/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl --fail --location --retry 5 --retry-delay 2 \
            --output "$godot_archive" \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q "$godot_archive" -d "$root/bin"
          mv "$root/bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64" "$root/bin/godot"
          chmod +x "$root/bin/godot"
          "$root/bin/godot" --version

          gitleaks_archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --location --retry 5 --retry-delay 2 \
            --output "$gitleaks_archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $gitleaks_archive" | sha256sum --check --status
          tar -xzf "$gitleaks_archive" -C "$root/bin" gitleaks
          chmod +x "$root/bin/gitleaks"
          "$root/bin/gitleaks" version

          tar -czf "$RUNNER_TEMP/retrolife-runner-tools.tar.gz" -C "$RUNNER_TEMP" retrolife-runner-tools

      - name: Upload runner tools
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: retrolife-cad-runner-tools
          path: ${{ runner.temp }}/retrolife-runner-tools.tar.gz
          if-no-files-found: error
          retention-days: 1
