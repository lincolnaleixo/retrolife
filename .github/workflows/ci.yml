name: Source validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-and-contracts:
    name: Rust workspace and design contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out the immutable commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --location --retry 5 --retry-delay 2 \
            --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $archive" | sha256sum --check --status
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          chmod +x "$RUNNER_TEMP/gitleaks"
          echo "GITLEAKS_BIN=$RUNNER_TEMP/gitleaks" >> "$GITHUB_ENV"

      - name: Verify Rust workspace
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo test --workspace --locked

      - name: Scan complete public history with Gitleaks
        run: |
          set -euo pipefail
          "$GITLEAKS_BIN" git --no-banner --redact --log-opts=--all .

      - name: Verify design contracts
        run: |
          set -euo pipefail
          python3 scripts/verify-m1-snes-contract.py
          python3 scripts/verify-m2-snes-reference.py
          python3 scripts/generate-m2-2-snes-front.py --check
          python3 scripts/verify-m2-2-snes-front.py
          git diff --exit-code
