name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Rust checks
        run: |
          rustup show
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
      - name: Dependency vulnerabilities
        run: |
          cargo install cargo-audit --locked --version 0.22.2
          cargo audit
      - name: Dependency licenses
        run: python3 scripts/check-dependencies.py
      - name: Publication content audit
        run: python3 scripts/audit-publication.py
      - name: Secret scan
        run: |
          curl --fail --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum --check
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git --redact --no-banner
      - name: Require changelog updates
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --depth=1 origin "$BASE_SHA"
          git diff --name-only "$BASE_SHA" HEAD | grep -qx CHANGELOG.md
      - name: Build pinned core
        run: scripts/build-core.sh
      - name: Real core integration
        run: scripts/test-core.sh
      - name: Build Godot bridge
        run: scripts/build.sh
      - name: Install Godot
        run: |
          curl --fail --location https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o /tmp/godot.zip
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/godot.zip" | sha256sum --check
          unzip /tmp/godot.zip -d /tmp/godot
      - name: Godot import
        run: /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path frontend/godot-ui --editor --import
      - name: Godot gameplay and input smoke
        run: |
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path frontend/godot-ui --script res://scripts/local_library_smoke.gd
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path frontend/godot-ui --script res://scripts/input_mapping_smoke.gd
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48
        with:
          fail-on-severity: high
