name: Codex Blender M2.3 reference review

on:
  push:
    branches: [codex/m2-3-blender-stage]
    paths:
      - scripts/blender/build_m2_3_reference_review.py
      - .github/workflows/codex-m2-3-blender-reference.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codex-m2-3-blender-reference
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out public branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install headless rendering dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends xauth xvfb libgl1-mesa-dri libglx-mesa0

      - name: Download public NTSC reference model
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/snes-ntsc-reference.zip"
          source_dir="$RUNNER_TEMP/snes-ntsc-reference"
          curl --fail --location --retry 5 --retry-delay 2 \
            --user-agent 'RetroLife public Blender review' \
            'https://www.thingiverse.com/thing:6364945/zip' \
            --output "$archive"
          mkdir -p "$source_dir"
          unzip -q "$archive" -d "$source_dir"
          python3 - "$source_dir" "$RUNNER_TEMP/source-mesh.txt" <<'PY'
          from pathlib import Path
          import sys
          root = Path(sys.argv[1])
          candidates = [p for p in root.rglob('*') if p.suffix.lower() in {'.stl', '.obj', '.ply'}]
          if not candidates:
              raise SystemExit('No supported mesh in the public archive')
          def score(path: Path) -> tuple[int, str]:
              name = path.name.lower()
              value = 0
              for token, weight in [('ntsc', 12), ('snes', 8), ('super', 3), ('nintendo', 3), ('cartridge', 7), ('reference', 4), ('complete', 6), ('full', 5)]:
                  if token in name:
                      value += weight
              for token, weight in [('label', -8), ('pcb', -8), ('insert', -5), ('logo', -5)]:
                  if token in name:
                      value += weight
              return value, str(path)
          selected = max(candidates, key=score)
          Path(sys.argv[2]).write_text(str(selected) + '\n')
          PY
          sha256sum "$archive" | tee "$RUNNER_TEMP/source-archive.sha256"
          sha256sum "$(cat "$RUNNER_TEMP/source-mesh.txt")" | tee "$RUNNER_TEMP/source-mesh.sha256"

      - name: Install official Blender 5.2.1
        run: |
          set -euo pipefail
          base='https://download.blender.org/release/Blender5.2'
          archive="$RUNNER_TEMP/blender.tar.xz"
          checks="$RUNNER_TEMP/blender.sha256"
          curl --fail --location --retry 5 --retry-delay 2 "$base/blender-5.2.1-linux-x64.tar.xz" --output "$archive"
          curl --fail --location --retry 5 --retry-delay 2 "$base/blender-5.2.1.sha256" --output "$checks"
          expected="$(grep -E '[[:space:]]blender-5\.2\.1-linux-x64\.tar\.xz$' "$checks" | head -n1 | awk '{print $1}')"
          test -n "$expected"
          echo "$expected  $archive" | sha256sum --check --status
          mkdir -p "$RUNNER_TEMP/blender"
          tar -xJf "$archive" -C "$RUNNER_TEMP/blender" --strip-components=1
          "$RUNNER_TEMP/blender/blender" --version

      - name: Render the public model in headless Blender
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          xvfb-run --auto-servernum --server-args='-screen 0 1920x1080x24 -nolisten tcp' \
            "$RUNNER_TEMP/blender/blender" \
            --background --factory-startup \
            --python scripts/blender/build_m2_3_reference_review.py -- \
            --root "$GITHUB_WORKSPACE" \
            --source "$(cat "$RUNNER_TEMP/source-mesh.txt")" \
            | tee "$RUNNER_TEMP/blender-review.log"
          grep -Fq 'RETROLIFE_M2_3_BLENDER_OK' "$RUNNER_TEMP/blender-review.log"
          test -s frontend/design/m2-3-snes-blender-manifest.json
          test -s frontend/godot-ui/assets/snes/m2_3/snes_ntsc_u_cartridge_m2_3.blend
          test -s frontend/godot-ui/assets/snes/m2_3/snes_ntsc_u_cartridge_m2_3.glb
          test -s frontend/design/mobile/m2-3-snes-blender-front-clay.png
          test -s frontend/design/mobile/m2-3-snes-blender-rear.png
          test -s frontend/design/mobile/m2-3-snes-blender-bottom.png

      - name: Upload Blender review package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: retrolife-m2-3-blender-reference-${{ github.sha }}
          path: |
            frontend/design/m2-3-snes-blender-manifest.json
            frontend/design/mobile/m2-3-snes-blender-*.png
            frontend/godot-ui/assets/snes/m2_3/snes_ntsc_u_cartridge_m2_3.blend
            frontend/godot-ui/assets/snes/m2_3/snes_ntsc_u_cartridge_m2_3.glb
            ${{ runner.temp }}/source-archive.sha256
            ${{ runner.temp }}/source-mesh.sha256
            ${{ runner.temp }}/blender-review.log
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
