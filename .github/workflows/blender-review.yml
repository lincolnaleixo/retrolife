name: Blender cartridge review
on:
  push:
    branches: [codex/blender-review-recovery]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: blender-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Verify public checkout
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.repository }}" = 'lincolnaleixo/retrolife'
          test -z "$(git status --porcelain)"
      - name: Prepare official Blender and comparison photos
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/review-toolchain"
          cd "$RUNNER_TEMP/review-toolchain"
          base='https://download.blender.org/release/Blender5.2'
          archive='blender-5.2.1-linux-x64.tar.xz'
          curl -fL --retry 3 "$base/$archive" -o "$archive"
          curl -fL --retry 3 "$base/blender-5.2.1.sha256" -o checksums.txt
          grep -E '[[:space:]]blender-5\.2\.1-linux-x64\.tar\.xz$' checksums.txt | sha256sum -c -
          curl -fL --retry 2 'https://media.gamestop.com/i/gamestop/10125270/Super-Mario-World---Super-Nintendo' -o physical-front.jpg
          curl -fL --retry 2 'https://i.ebayimg.com/images/g/gHoAAOSwl55jtYUo/s-l1200.jpg' -o physical-detail.jpg
          printf '%s\n' 'Photos are external comparison references, not distributable RetroLife textures.' > REFERENCE-NOTE.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: blender-review-toolchain
          path: ${{ runner.temp }}/review-toolchain/
          retention-days: 2
          compression-level: 0
          if-no-files-found: error
