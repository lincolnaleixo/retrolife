name: Apply verified M2.2 v3 rebuild

on:
  push:
    branches: [codex/m2-2-physical-rebuild]
    paths:
      - scripts/generate-m2-2-snes-front-v3.py
      - scripts/verify-m2-2-snes-front-v3.py
      - .github/workflows/apply-m2-2-v3.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-m2-2-v3-${{ github.ref }}
  cancel-in-progress: false

env:
  GODOT_VERSION: "4.7"
  GITLEAKS_VERSION: "8.30.1"

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Install pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          checksums="$RUNNER_TEMP/gitleaks-checksums.txt"
          install_root="$RUNNER_TEMP/gitleaks-${GITLEAKS_VERSION}"
          curl --fail --location --retry 5 --retry-delay 2 \
            --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --location --retry 5 --retry-delay 2 \
            --output "$checksums" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          expected="$(awk '$2 == "gitleaks_'"${GITLEAKS_VERSION}"'_linux_x64.tar.gz" { print $1 }' "$checksums")"
          test -n "$expected"
          printf '%s  %s\n' "$expected" "$archive" | sha256sum --check --status
          mkdir -p "$install_root"
          tar -xzf "$archive" -C "$install_root" gitleaks
          chmod +x "$install_root/gitleaks"
          echo "GITLEAKS_BIN=$install_root/gitleaks" >> "$GITHUB_ENV"
          "$install_root/gitleaks" version

      - name: Install official Godot
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          install_root="$RUNNER_TEMP/godot-${GODOT_VERSION}"
          curl --fail --location --retry 5 --retry-delay 2 \
            --output "$archive" \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          mkdir -p "$install_root"
          unzip -q "$archive" -d "$install_root"
          godot_bin="$install_root/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          chmod +x "$godot_bin"
          "$godot_bin" --version
          echo "GODOT_BIN=$godot_bin" >> "$GITHUB_ENV"

      - name: Materialize the v3 source package
        shell: bash
        run: |
          set -euo pipefail
          cp scripts/generate-m2-2-snes-front-v3.py scripts/generate-m2-2-snes-front.py
          cp scripts/verify-m2-2-snes-front-v3.py scripts/verify-m2-2-snes-front.py
          rm scripts/generate-m2-2-snes-front-v3.py
          rm scripts/verify-m2-2-snes-front-v3.py
          rm -f .github/workflows/codex-export-v3.yml
          rm -f .github/workflows/apply-m2-2-v3.yml
          python3 scripts/generate-m2-2-snes-front.py
          python3 - <<'PY'
          from pathlib import Path

          readme = Path("README.md")
          text = readme.read_text()
          text = text.replace(
              "- Original procedural M2 and M2.2 assets with their own CC0 notices",
              "- Original procedural M2 and M2.2 v3 assets with their own CC0 notices",
          )
          text = text.replace(
              "The M2.2 cartridge front is a provisional dimensional blockout. Physical calibration and owner approval are still required before it can be treated as final geometry.",
              "The M2.2 v3 cartridge front is an original multi-section loft rebuilt against the public physical-reference package. Physical calibration and owner approval are still required before it can be treated as final geometry.",
          )
          text = text.replace(
              "The M2.2 v2 cartridge front is a provisional continuous-surface rebuild. Physical calibration and owner approval are still required before it can be treated as final geometry.",
              "The M2.2 v3 cartridge front is an original multi-section loft rebuilt against the public physical-reference package. Physical calibration and owner approval are still required before it can be treated as final geometry.",
          )
          readme.write_text(text)

          design = Path("frontend/design/README.md")
          text = design.read_text()
          if "mobile/m2-2-snes-v3-mobile-review.png" not in text:
              text += "\n## Mobile review\n\nThe deterministic PNG review sheet at `mobile/m2-2-snes-v3-mobile-review.png` mirrors the current generated v3 geometry for mobile browsers that do not render repository SVGs reliably.\n"
          design.write_text(text)

          third = Path("THIRD_PARTY.md")
          text = third.read_text()
          if "External visual comparison references" not in text:
              text += "\n## External visual comparison references\n\nM2.2 v3 records links to an authentic-cartridge scan, public cartridge photography, bottom photography and USD343833S. These sources are used for visual comparison only. No external mesh vertices, textures or photographs are copied into the generated CC0 asset package. See `frontend/design/m2-2-snes-v3-physical-comparison.md`.\n"
          third.write_text(text)
          PY

      - name: Verify every pre-push gate
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo test --workspace --locked
          python3 scripts/verify-m1-snes-contract.py
          python3 scripts/verify-m2-snes-reference.py
          python3 scripts/generate-m2-2-snes-front.py --check
          python3 scripts/verify-m2-2-snes-front.py
          python3 -m compileall -q scripts frontend/godot-ui/scripts
          "$GITLEAKS_BIN" dir . --no-banner --redact --exit-code 1
          "$GODOT_BIN" --headless --path frontend/godot-ui --editor --quit-after 20 || true
          "$GODOT_BIN" --headless --path frontend/godot-ui \
            --script res://scripts/m2_2_snes_front_smoke_test.gd \
            | tee "$RUNNER_TEMP/m2-2-v3-smoke.txt"
          grep -Fq 'RETROLIFE_M2_2_FRONT_GODOT_OK' "$RUNNER_TEMP/m2-2-v3-smoke.txt"
          git diff --check
          test -z "$(find . -type d \( -name __pycache__ -o -name .godot \) -prune -print)" || rm -rf frontend/godot-ui/.godot scripts/__pycache__
          git diff --check

      - name: Commit, rescan and push
        shell: bash
        run: |
          set -euo pipefail
          rm -rf frontend/godot-ui/.godot scripts/__pycache__ frontend/godot-ui/scripts/__pycache__
          git add -A
          git diff --cached --check
          git config user.name "RetroLife public builder"
          git config user.email "2906581+lincolnaleixo@users.noreply.github.com"
          git commit -m "feat: rebuild M2.2 shell from physical-shape loft"
          "$GITLEAKS_BIN" git . --no-banner --redact --exit-code 1
          git push origin HEAD:codex/m2-2-physical-rebuild
