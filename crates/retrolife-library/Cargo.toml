[package]
name = "retrolife-library"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "A small durable library store for user-owned SNES ROM imports."
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zip = { version = "=9.1.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
