<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1140" viewBox="0 0 1900 1140" role="img" aria-labelledby="title desc"><title id="title">RetroLife M1 SNES motion storyboard</title><desc id="desc">Normal and reduced-motion keyframes for the SNES bottom-dock interaction.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#07080D"/><stop offset="1" stop-color="#111522"/>
  </linearGradient>
  <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#CACBD0"/><stop offset="1" stop-color="#92959D"/>
  </linearGradient>
  <linearGradient id="label" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#5966B9"/><stop offset="1" stop-color="#D95F9D"/>
  </linearGradient>
  <linearGradient id="dockGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#1B202C"/><stop offset="1" stop-color="#0F1219"/>
  </linearGradient>
  <filter id="shadow" x="-40%" y="-40%" width="180%" height="220%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="12"/><feOffset dy="12"/>
    <feComponentTransfer><feFuncA type="linear" slope=".48"/></feComponentTransfer>
    <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <symbol id="cart" viewBox="-125 -82 250 164">
    <path d="M-105-80H105L125-58V54H107V72H58V80H-58V72H-107V54H-125V-58Z" fill="url(#shell)" stroke="#777A82" stroke-width="2"/>
    <rect x="-104" y="-62" width="208" height="10" rx="4" fill="#8F9299" opacity=".66"/>
    <rect x="-82" y="-48" width="164" height="74" rx="8" fill="url(#label)" stroke="#FFF" stroke-opacity=".22"/>
    <circle cx="-60" cy="-26" r="9" fill="#F6D365"/>
    <path d="M-42 6C-10-40 30-34 58 4" fill="none" stroke="#79D7FF" stroke-width="5" stroke-linecap="round" opacity=".8"/>
    <text x="0" y="-4" text-anchor="middle" fill="#FFF" font-family="Helvetica Neue,sans-serif" font-size="15" font-weight="700">CHRONO TRIGGER</text>
    <text x="0" y="50" text-anchor="middle" fill="#666A72" font-family="Helvetica Neue,sans-serif" font-size="9" font-weight="700" letter-spacing="1.6">SUPER NINTENDO</text>
    <rect x="-48" y="62" width="96" height="8" rx="2" fill="#6D7078"/>
  </symbol>
  <symbol id="dockShape" viewBox="-240 -48 480 96">
    <ellipse cx="0" cy="37" rx="205" ry="17" fill="#000" opacity=".42"/>
    <rect x="-240" y="-42" width="480" height="84" rx="24" fill="url(#dockGrad)" stroke="#343D50" stroke-width="2"/>
    <rect x="-112" y="-30" width="224" height="18" rx="9" fill="#242B39" stroke="#B9A7FF" stroke-opacity=".35" stroke-width="2"/>
    <rect x="-96" y="-25" width="192" height="8" rx="4" fill="#090B10"/>
    <text x="0" y="27" text-anchor="middle" fill="#697385" font-family="Helvetica Neue,sans-serif" font-size="11" letter-spacing="2.6">RETROLIFE</text>
  </symbol>
</defs>
<rect width="1900" height="1140" fill="#05060A"/><text x="30" y="40" fill="#F6F7FB" font-family="Helvetica Neue,sans-serif" font-size="25" font-weight="700">RETROLIFE M1 · SNES MOTION STORYBOARD</text><text x="1870" y="40" text-anchor="end" fill="#8F98A8" font-family="Helvetica Neue,sans-serif" font-size="13">docking 620 ms · undocking 540 ms · reduced motion 120 ms</text><g id="story-0" data-story-index="0"><rect x="30" y="78" width="430" height="360" rx="16" fill="url(#bg)" stroke="#262D3B" stroke-width="2"/><text x="48" y="104" fill="#B9A7FF" font-family="Helvetica Neue,sans-serif" font-size="15" font-weight="700">0 ms</text><text x="442" y="104" text-anchor="end" fill="#8F98A8" font-family="Helvetica Neue,sans-serif" font-size="11">focused</text><use href="#cart" x="120.0" y="153.0" width="250" height="164.0" filter="url(#shadow)"/></g><g id="story-1" data-story-index="1"><rect x="490" y="78" width="430" height="360" rx="16" fill="url(#bg)" stroke="#262D3B" stroke-width="2"/><text x="508" y="104" fill="#B9A7FF" font-family="Helvetica Neue,sans-serif" font-size="15" font-weight="700">70 ms</text><text x="902" y="104" text-anchor="end" fill="#8F98A8" font-family="Helvetica Neue,sans-serif" font-size="11">1.8% lift</text><use href="#dockShape" x="545" y="356" width="320" height="64"/><use href="#cart" x="578.0" y="136.688" width="254" height="166.624" filter="url(#shadow)"/></g><g id="story-2" data-story-index="2"><rect x="950" y="78" width="430" height="360" rx="16" fill="url(#bg)" stroke="#262D3B" stroke-width="2"/><text x="968" y="104" fill="#B9A7FF" font-family="Helvetica Neue,sans-serif" font-size="15" font-weight="700">180 ms</text><text x="1362" y="104" text-anchor="end" fill="#8F98A8" font-family="Helvetica Neue,sans-serif" font-size="11">travel begins</text><use href="#dockShape" x="1005" y="356" width="320" height="64"/><use href="#cart" x="1047.5" y="177.92" width="235" height="154.16" filter="url(#shadow)"/></g><g id="story-3" data-story-index="3"><rect x="1410" y="78" width="430" height="360" rx="16" fill="url(#bg)" stroke="#262D3B" stroke-width="2"/><text x="1428" y="104" fill="#B9A7FF" font-family="Helvetica Neue,sans-serif" font-size="15" font-weight="700">250 ms</text><text x="1822" y="104" text-anchor="end" fill="#8F98A8" font-family="Helvetica Neue,sans-serif" font-size="11">dock approach</text><use href="#dockShape" x="1465" y="356" width="320" height="64"/><use href="#cart" x="1515.0" y="212.84" width="220" height="144.32" filter="url(#shadow)"/></g><g id="story-4" data-story-index="4"><rect x="30" y="472" width="430" height="360" rx="16" fill="url(#bg)" stroke="#262D3B" stroke-width="2"/><text x="48" y="498" fill="#B9A7FF" font-family="Helvetica Neue,sans-serif" font-size="15" font-weight="700">360 ms</text><text x="442" y="498" text-anchor="end" fill="#8F98A8" font-family="Helvetica Neue,sans-serif" font-size="11">align slot</text><use href="#dockShape" x="85" y="750" width="320" height="64"/><use href="#cart" x="147.5" y="606.04" width="195" height="127.92" filter="url(#shadow)"/></g><g id="story-5" data-story-index="5"><rect x="490" y="472" width="430" height="360" rx="16" fill="url(#bg)" stroke="#262D3B" stroke-width="2"/><text x="508" y="498" fill="#B9A7FF" font-family="Helvetica Neue,sans-serif" font-size="15" font-weight="700">480 ms</text><text x="902" y="498" text-anchor="end" fill="#8F98A8" font-family="Helvetica Neue,sans-serif" font-size="11">7 px overshoot</text><use href="#dockShape" x="545" y="750" width="320" height="64"/><use href="#cart" x="615.0" y="640.96" width="180" height="118.08" filter="url(#shadow)"/></g><g id="story-6" data-story-index="6"><rect x="950" y="472" width="430" height="360" rx="16" fill="url(#bg)" stroke="#262D3B" stroke-width="2"/><text x="968" y="498" fill="#B9A7FF" font-family="Helvetica Neue,sans-serif" font-size="15" font-weight="700">560 ms</text><text x="1362" y="498" text-anchor="end" fill="#8F98A8" font-family="Helvetica Neue,sans-serif" font-size="11">seat recovery</text><use href="#dockShape" x="1005" y="750" width="320" height="64"/><use href="#cart" x="1076.0" y="631.616" width="178" height="116.768" filter="url(#shadow)"/></g><g id="story-7" data-story-index="7"><rect x="1410" y="472" width="430" height="360" rx="16" fill="url(#bg)" stroke="#262D3B" stroke-width="2"/><text x="1428" y="498" fill="#B9A7FF" font-family="Helvetica Neue,sans-serif" font-size="15" font-weight="700">620 ms</text><text x="1822" y="498" text-anchor="end" fill="#8F98A8" font-family="Helvetica Neue,sans-serif" font-size="11">docked focus</text><use href="#dockShape" x="1465" y="750" width="320" height="64"/><use href="#cart" x="1536.0" y="626.616" width="178" height="116.768" filter="url(#shadow)"/></g><path d="M465 258h18m-6-6 7 6-7 6" fill="none" stroke="#B9A7FF" stroke-width="2"/><path d="M925 258h18m-6-6 7 6-7 6" fill="none" stroke="#B9A7FF" stroke-width="2"/><path d="M1385 258h18m-6-6 7 6-7 6" fill="none" stroke="#B9A7FF" stroke-width="2"/><path d="M465 652h18m-6-6 7 6-7 6" fill="none" stroke="#B9A7FF" stroke-width="2"/><path d="M925 652h18m-6-6 7 6-7 6" fill="none" stroke="#B9A7FF" stroke-width="2"/><path d="M1385 652h18m-6-6 7 6-7 6" fill="none" stroke="#B9A7FF" stroke-width="2"/><g id="reduced-sequence"><rect x="30" y="866" width="1840" height="230" rx="18" fill="#0B0E16" stroke="#262D3B" stroke-width="2"/><text x="52" y="900" fill="#79D7FF" font-family="Helvetica Neue,sans-serif" font-size="18" font-weight="700">REDUCED MOTION · SAME STATE SEMANTICS</text><text x="1848" y="900" text-anchor="end" fill="#8F98A8" font-family="Helvetica Neue,sans-serif" font-size="12">no travel · no rotation · no scale pulse</text><g id="reduced-0" data-reduced-index="0"><rect x="70" y="920" width="530" height="150" rx="14" fill="#07080D" stroke="#202736"/><text x="86" y="945" fill="#79D7FF" font-family="Helvetica Neue,sans-serif" font-size="14" font-weight="700">0 ms</text><text x="584" y="945" text-anchor="end" fill="#9CA5B5" font-family="Helvetica Neue,sans-serif" font-size="11">browse focused</text><use href="#cart" x="285" y="971" width="100" height="65.6" opacity="1"/></g><path d="M618 996h36m-7-6 8 6-8 6" fill="none" stroke="#79D7FF" stroke-width="2"/><g id="reduced-1" data-reduced-index="1"><rect x="685" y="920" width="530" height="150" rx="14" fill="#07080D" stroke="#202736"/><text x="701" y="945" fill="#79D7FF" font-family="Helvetica Neue,sans-serif" font-size="14" font-weight="700">60 ms</text><text x="1199" y="945" text-anchor="end" fill="#9CA5B5" font-family="Helvetica Neue,sans-serif" font-size="11">chrome crossfade</text><use href="#dockShape" x="820" y="1014" width="260" height="52"/><use href="#cart" x="900" y="971" width="100" height="65.6" opacity="0.72"/></g><path d="M1233 996h36m-7-6 8 6-8 6" fill="none" stroke="#79D7FF" stroke-width="2"/><g id="reduced-2" data-reduced-index="2"><rect x="1300" y="920" width="530" height="150" rx="14" fill="#07080D" stroke="#202736"/><text x="1316" y="945" fill="#79D7FF" font-family="Helvetica Neue,sans-serif" font-size="14" font-weight="700">120 ms</text><text x="1814" y="945" text-anchor="end" fill="#9CA5B5" font-family="Helvetica Neue,sans-serif" font-size="11">docked with dock:primary focus</text><use href="#dockShape" x="1435" y="1014" width="260" height="52"/><use href="#cart" x="1515" y="971" width="100" height="65.6" opacity="1"/></g></g><text x="30" y="1126" fill="#8F98A8" font-family="Helvetica Neue,sans-serif" font-size="12">Back during docking reverses continuously from current normalized progress. Resize preserves progress and recomputes endpoints.</text></svg>
