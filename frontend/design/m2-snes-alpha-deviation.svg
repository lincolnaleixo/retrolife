<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980"><title>M2 alpha deviation report</title><rect width="100%" height="100%" fill="#07080d"/><style>text{font-family:system-ui,sans-serif}.t{fill:#f6f7fb}.m{fill:#9ca5b5}.ref{stroke:#b9a7ff;fill:#b9a7ff;fill-opacity:.08;stroke-width:4}.alpha{stroke:#ff6f7d;fill:none;stroke-width:4;stroke-dasharray:12 8}.feature{stroke:#f6f7fb;fill:none;stroke-width:2}.bad{fill:#ff9aa4}.ok{fill:#9ee6b2}</style><text x="800" y="50" text-anchor="middle" class="t" font-size="32" font-weight="700">M2 alpha versus M2.1 reference</text><text x="800" y="82" text-anchor="middle" class="m" font-size="16">The alpha is an engineering blockout and is excluded from the production runtime target.</text><path d="M 232.5 140 L 647.5 140 L 647.5 172.5 L 780 172.5 L 780 580 L 100 580 L 100 172.5 L 232.5 172.5 Z" class="ref"/><rect x="102.5" y="148.0" width="675" height="432.0" rx="22" class="alpha"/><rect x="232.5" y="152.5" width="415" height="192.5" rx="18" class="feature"/><rect x="241.25" y="202.5" width="397.5" height="155" rx="12" class="alpha"/><rect x="232.5" y="372.5" width="415" height="185" rx="15" class="feature"/><rect x="295.0" y="423.0" width="290" height="36.0" rx="10" class="alpha"/><text x="440" y="635" text-anchor="middle" class="t" font-size="22" font-weight="600">Front overlay</text><text x="440" y="665" text-anchor="middle" class="m" font-size="15">Purple: reference. Red dashed: rejected alpha.</text><rect x="850" y="135" width="650" height="680" rx="24" fill="#10141d" stroke="#242b39" stroke-width="2"/><text x="890" y="185" class="t" font-size="24" font-weight="700">Critical deviations</text><circle cx="890" cy="228" r="6" fill="#ff6f7d"/><text x="910" y="235" class="bad" font-size="18" font-weight="700">Side wings</text><text x="910" y="260" class="m" font-size="15">Alpha uses narrow auxiliary prisms, not broad 26.5 mm shell masses.</text><circle cx="890" cy="308" r="6" fill="#ff6f7d"/><text x="910" y="315" class="bad" font-size="18" font-weight="700">Grip bands</text><text x="910" y="340" class="m" font-size="15">Alpha uses ladder-like ribs, not five full-width horizontal</text><text x="910" y="360" class="m" font-size="15">grooves.</text><circle cx="890" cy="408" r="6" fill="#ff6f7d"/><text x="910" y="415" class="bad" font-size="18" font-weight="700">Label recess</text><text x="910" y="440" class="m" font-size="15">Alpha is about 19.5% too short vertically.</text><circle cx="890" cy="488" r="6" fill="#ff6f7d"/><text x="910" y="495" class="bad" font-size="18" font-weight="700">Lower front</text><text x="910" y="520" class="m" font-size="15">Alpha is 58 × 7.2 mm instead of a large moulded 83 × 37 mm field.</text><circle cx="890" cy="568" r="6" fill="#ff6f7d"/><text x="910" y="575" class="bad" font-size="18" font-weight="700">Rear shell</text><text x="910" y="600" class="m" font-size="15">Alpha uses a generic panel and fine grille instead of broad moulded</text><text x="910" y="620" class="m" font-size="15">bands.</text><circle cx="890" cy="668" r="6" fill="#ff6f7d"/><text x="910" y="675" class="bad" font-size="18" font-weight="700">Connector</text><text x="910" y="700" class="m" font-size="15">Alpha uses a solid bar and contact boxes instead of a recessed</text><text x="910" y="720" class="m" font-size="15">cavity.</text><rect x="100" y="850" width="1400" height="80" rx="18" fill="#10141d" stroke="#242b39"/><text x="130" y="885" class="t" font-size="18" font-weight="700">Decision</text><text x="230" y="885" class="m" font-size="16">Do not polish the alpha. Rebuild the shell from the M2.1 reference package and remove the alpha from the active runtime in M2.5.</text></svg>
