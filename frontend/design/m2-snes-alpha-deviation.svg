<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980"><title>M2 alpha deviation report against M2.1 v3</title><rect width="100%" height="100%" fill="#07080d"/><style>text{font-family:system-ui,sans-serif}.t{fill:#f6f7fb}.m{fill:#9ca5b5}.ref{stroke:#b9a7ff;fill:#b9a7ff;fill-opacity:.08;stroke-width:4}.alpha{stroke:#ff6f7d;fill:none;stroke-width:4;stroke-dasharray:12 8}.feature{stroke:#f6f7fb;fill:none;stroke-width:2}.bad{fill:#ff9aa4}</style><text x="800" y="50" text-anchor="middle" class="t" font-size="32" font-weight="700">M2 alpha versus M2.1 v3 reference</text><text x="800" y="82" text-anchor="middle" class="m" font-size="16">The alpha and M2.2 v1 through v4 are excluded from the active production target.</text><path d="M 90.4,480.0 L 89.0,479.9 L 87.7,479.6 L 86.4,479.2 L 85.2,478.6 L 84.1,477.9 L 83.0,477.0 L 82.1,475.9 L 81.4,474.8 L 80.8,473.6 L 80.4,472.3 L 80.1,471.0 L 80.0,469.6 L 80.0,157.4 L 80.1,156.2 L 80.3,155.0 L 80.7,153.8 L 81.3,152.7 L 81.9,151.7 L 82.8,150.8 L 83.7,149.9 L 84.7,149.3 L 85.8,148.7 L 87.0,148.3 L 88.2,148.1 L 89.4,148.0 L 159.6,148.0 L 160.9,147.8 L 162.2,147.4 L 163.6,146.7 L 165.1,145.9 L 166.5,144.8 L 168.0,143.6 L 169.5,142.3 L 171.0,140.9 L 172.5,139.4 L 173.9,137.9 L 175.4,136.4 L 176.8,134.9 L 178.1,133.5 L 179.5,132.1 L 180.7,130.9 L 181.9,129.7 L 183.0,128.8 L 184.0,128.0 L 520.0,128.0 L 521.0,128.8 L 522.1,129.7 L 523.3,130.9 L 524.5,132.1 L 525.9,133.5 L 527.2,134.9 L 528.6,136.4 L 530.1,137.9 L 531.5,139.4 L 533.0,140.9 L 534.5,142.3 L 536.0,143.6 L 537.5,144.8 L 538.9,145.9 L 540.4,146.7 L 541.8,147.4 L 543.1,147.8 L 544.4,148.0 L 614.6,148.0 L 615.8,148.1 L 617.0,148.3 L 618.2,148.7 L 619.3,149.3 L 620.3,149.9 L 621.2,150.8 L 622.1,151.7 L 622.7,152.7 L 623.3,153.8 L 623.7,155.0 L 623.9,156.2 L 624.0,157.4 L 624.0,469.6 L 623.9,471.0 L 623.6,472.3 L 623.2,473.6 L 622.6,474.8 L 621.9,475.9 L 621.0,477.0 L 619.9,477.9 L 618.8,478.6 L 617.6,479.2 L 616.3,479.6 L 615.0,479.9 L 613.6,480.0 Z" class="ref" transform="translate(88 12)"/><rect x="190" y="155" width="500" height="405" rx="22" class="alpha"/><rect x="271.0" y="160.0" width="338.0" height="152.0" rx="8" class="feature"/><text x="440" y="635" text-anchor="middle" class="t" font-size="22" font-weight="600">Front overlay</text><text x="440" y="665" text-anchor="middle" class="m" font-size="15">Purple: v3 reference. Red dashed: rejected alpha.</text><rect x="850" y="135" width="650" height="680" rx="24" fill="#10141d" stroke="#242b39" stroke-width="2"/><text x="890" y="185" class="t" font-size="24" font-weight="700">Critical deviations</text><circle cx="890" cy="228" r="6" fill="#ff6f7d"/><text x="910" y="235" class="bad" font-size="18" font-weight="700">Side wings</text><text x="910" y="260" class="m" font-size="15">Rejected geometry does not preserve the broad 22 mm wing masses.</text><circle cx="890" cy="308" r="6" fill="#ff6f7d"/><text x="910" y="315" class="bad" font-size="18" font-weight="700">Grip bands</text><text x="910" y="340" class="m" font-size="15">Use four narrow divisions that form five broad bands per wing.</text><circle cx="890" cy="388" r="6" fill="#ff6f7d"/><text x="910" y="395" class="bad" font-size="18" font-weight="700">Label recess</text><text x="910" y="420" class="m" font-size="15">Target 84.5 × 38.0 mm with a shallow molded boundary.</text><circle cx="890" cy="468" r="6" fill="#ff6f7d"/><text x="910" y="475" class="bad" font-size="18" font-weight="700">Lower front</text><text x="910" y="500" class="m" font-size="15">Use paired recesses across an 87 mm field and an 18 mm bridge.</text><circle cx="890" cy="548" r="6" fill="#ff6f7d"/><text x="910" y="555" class="bad" font-size="18" font-weight="700">Shoulder rise</text><text x="910" y="580" class="m" font-size="15">The central crown is only about 5 mm above the side wings.</text><circle cx="890" cy="628" r="6" fill="#ff6f7d"/><text x="910" y="635" class="bad" font-size="18" font-weight="700">Connector</text><text x="910" y="660" class="m" font-size="15">The front milestone must preserve the bottom pivot and cavity clearance.</text><rect x="100" y="850" width="1400" height="80" rx="18" fill="#10141d" stroke="#242b39"/><text x="130" y="885" class="t" font-size="18" font-weight="700">Decision</text><text x="230" y="885" class="m" font-size="16">Do not patch rejected geometry. Rebuild from the photo-normalized M2.1 v3 package and retain the physical-caliper gate.</text></svg>
